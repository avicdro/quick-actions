# quick-actions configuration
# Coloca este archivo junto al .exe o en %APPDATA%\quick-actions\

[ollama]
model = "gemma4:cloud"
endpoint = "http://localhost:11434/api/generate"
timeout_seconds = 60

[ui]
font_size = 16              # Tamano de fuente en ventanas de resultado
window_width = 800
window_height = 600
history_max_entries = 50    # Maximo entradas en historial de correcciones

[hotkeys]
# Las hotkeys estan hardcodeadas en codigo (como AHK),
# pero puedes desactivar modulos enteros aqui:
enabled = true
# Modificador: "alt" (default, preferencia del usuario) o "capslock".
modifier = "alt"
# Solo aplica con modifier = "capslock":
#   "hold"   = mantener presionado CapsLock + tecla para disparar
#              (el CapsLock nativo sigue alternando mayusculas)
#   "toggle" = tap de CapsLock queda "latched"; la proxima tecla de atajo
#              dispara y apaga el latch. En este modo CapsLock YA NO
#              alterna mayusculas nativamente.
capsmode = "hold"

# Pausa modular: false desactiva un atajo concreto sin tocar el resto
# (tambien desde el menu del tray o la pestana Ajustes).
correct = true
translate = true
summarize = true
generate = true
history = true
help = true

[app]
# Iniciar automaticamente con Windows (HKCU\...\Run).
# Solo define el estado inicial; cuando lo toggles desde el tray, el
# registro manda y esta linea se actualiza automaticamente.
autostart = false
# Verificar updates al arrancar (GET /releases/latest de GitHub).
check_updates = true
# Repo a consultar (vacio = sin check).
repository = "avicdro/quick-actions"

[paths]
chrome = "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"

# Para fases futuras (app-launcher, notifications)
[launcher]
enabled = false # Fase 4
[notifications]
enabled = false # Fase 5
