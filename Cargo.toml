[package]
name = "quick-actions"
version = "0.2.8"
edition = "2021"
authors = ["avicdro"]
description = "Suite de atajos globales para IA y productividad (migracion AHK)"
license = "MIT"

[dependencies]
# Async runtime + HTTP
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# U7: verificacion sha256 del binario descargado por el auto-update
sha2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config
toml = "0.8"
# Edicion preservante de toml (para flags on-the-fly como autostart)
toml_edit = "0.22"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Fechas para historial
chrono = { version = "0.4", features = ["serde"] }

# Logging (con escritura a archivo para debug en Windows)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# --- Windows-only dependencies ---
[target.'cfg(windows)'.dependencies]
# Clipboard
arboard = "3.5"
# Simulate keypresses
enigo = "0.2"
# GUI flotante — renderer Wgpu (L9/B1: Backends::PRIMARY + LowPower; sin iGPU
# en el equipo de referencia, va a la dGPU de todas formas — ver N1)
eframe = { version = "0.29", default-features = false, features = ["glow", "wgpu"] }
egui = "0.29"
# Windows API (keyboard hook + tray icon)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# NOTA: NO usar panic = "abort" porque mata el proceso si un thread panickea

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
perf = "warn"
style = "warn"